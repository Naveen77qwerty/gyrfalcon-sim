[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gyrfalcon-sim"
version = "0.1.0"
description = "Falcon-style reliable transport simulator with an inner-workings dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["falcon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
